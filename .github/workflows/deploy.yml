name: Build PDF and Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Config into index.html
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -f index.html ]; then
            # Inject GH_CONFIG for API data saving
            sed -i 's|<head>|<head><script>window.GH_CONFIG = { repo: "${{ github.repository }}", token: "${{ secrets.GH_PAT }}" };</script>|g' index.html
            
            # Inject AUTH_CONFIG for static GitHub Pages login
            if [ -n "$ADMIN_PASSWORD" ]; then
              SALT="prakhar_cv_salt_2026"
              HASH=$(node -e "const crypto = require('crypto'); console.log(crypto.createHash('sha256').update('$SALT' + process.env.ADMIN_PASSWORD).digest('hex'));")
              sed -i "s|<head>|<head><script>window.AUTH_CONFIG = { salt: '$SALT', hash: '$HASH' };</script>|g" index.html
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Generate PDF CV via Puppeteer
        run: node generate-pdf.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
