name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install puppeteer

      - name: Generate PDF CV
        run: node generate-pdf.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject Auth & GitHub Config into index.html
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const password = process.env.ADMIN_PASSWORD || "";
            const salt = crypto.randomBytes(16).toString("hex");
            const hash = crypto.createHash("sha256").update(salt + password).digest("hex");
            const pat = process.env.GH_PAT || "";
            const repo = process.env.GH_REPO || "";
            
            let html = fs.readFileSync("index.html", "utf8");
            if (html.includes("</head>")) {
              const configScript = `<script>window.AUTH_CONFIG = { salt: "${salt}", hash: "${hash}" }; window.GH_CONFIG = { repo: "${repo}", token: "${pat}" };</script>\n</head>`;
              html = html.replace("</head>", configScript);
              fs.writeFileSync("index.html", html, "utf8");
            } else {
              console.error("Error: </head> tag not found in index.html");
              process.exit(1);
            }
          '

      - name: Commit Generated PDF and Injected Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Prakhar Srivastava - CV.pdf" "index.html"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate PDF and update auth config [skip ci]" && git push)
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
