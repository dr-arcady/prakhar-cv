name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Inject Password
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Cleanly inject the password string into index.html
          CLEAN_PW=$(echo -n "$ADMIN_PASSWORD" | tr -d '\r\n')
          sed -i "s/<!-- __ADMIN_PASSWORD_HASH__ -->/$CLEAN_PW/g" index.html
          
          # Replace placeholder in index.html
          sed -i "s/<!-- __ADMIN_PASSWORD_HASH__ -->/$HASHED_PW/g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
