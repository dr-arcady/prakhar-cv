<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dr. Prakhar Srivastava - CV</title>
    <!-- Tailwind CSS CDN for styling print layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1c1917;
            -webkit-print-color-adjust: exact;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        @media print {
            body { padding: 0; background: white; }
            .no-print { display: none !important; }
            page { margin: 0; }
        }
    </style>
</head>
<body class="bg-white text-stone-900 p-8 max-w-5xl mx-auto">

    <!-- Top Header -->
    <div class="border-b-2 border-stone-800 pb-6 mb-8 flex justify-between items-start">
        <div>
            <h1 class="font-serif text-4xl font-bold tracking-tight text-stone-900 mb-1">Dr. Prakhar Srivastava</h1>
            <p class="text-stone-600 text-sm font-medium tracking-wide uppercase">Ph.D. English | Scholar & Creative Writer</p>
        </div>
        <div class="text-right text-xs text-stone-600 space-y-1">
            <div><i class="fa-solid fa-envelope mr-1 text-stone-400"></i> prakharsrivastava6@gmail.com</div>
            <div><i class="fa-solid fa-phone mr-1 text-stone-400"></i> +91 77427 66925</div>
            <div><i class="fa-solid fa-globe mr-1 text-stone-400"></i> writewithfolio.vercel.app</div>
        </div>
    </div>

    <!-- Two-Column Layout (Sidebar + Main Content) -->
    <div class="grid grid-cols-3 gap-8">
        
        <!-- Left Sidebar: Background, Skills, Socials, References -->
        <div class="col-span-1 space-y-6 bg-stone-50 p-6 rounded-2xl border border-stone-200">
            <div>
                <h3 class="font-serif font-bold text-stone-900 text-sm uppercase tracking-wider border-b border-stone-300 pb-2 mb-3">Education & Background</h3>
                <div id="print-background" class="space-y-4 text-xs"></div>
            </div>

            <div>
                <h3 class="font-serif font-bold text-stone-900 text-sm uppercase tracking-wider border-b border-stone-300 pb-2 mb-3">Skills & Expertise</h3>
                <div id="print-skills" class="space-y-3 text-xs"></div>
            </div>

            <div>
                <h3 class="font-serif font-bold text-stone-900 text-sm uppercase tracking-wider border-b border-stone-300 pb-2 mb-3">References</h3>
                <div id="print-references" class="space-y-3 text-xs"></div>
            </div>
        </div>

        <!-- Right Main Content: Publications, Presentations, Seminars, Creative -->
        <div class="col-span-2 space-y-8">
            <div>
                <h2 class="font-serif font-bold text-xl text-stone-900 border-b-2 border-stone-200 pb-2 mb-4 flex items-center">
                    <i class="fa-solid fa-book-open mr-2 text-stone-700 text-base"></i> Publications
                </h2>
                <div id="print-publications" class="space-y-4"></div>
            </div>

            <div>
                <h2 class="font-serif font-bold text-xl text-stone-900 border-b-2 border-stone-200 pb-2 mb-4 flex items-center">
                    <i class="fa-solid fa-chalkboard-user mr-2 text-stone-700 text-base"></i> Presentations & Conferences
                </h2>
                <div id="print-presentations" class="space-y-4"></div>
            </div>

            <div>
                <h2 class="font-serif font-bold text-xl text-stone-900 border-b-2 border-stone-200 pb-2 mb-4 flex items-center">
                    <i class="fa-solid fa-graduation-cap mr-2 text-stone-700 text-base"></i> Seminars & Courses
                </h2>
                <div id="print-seminars" class="space-y-4"></div>
            </div>

            <div>
                <h2 class="font-serif font-bold text-xl text-stone-900 border-b-2 border-stone-200 pb-2 mb-4 flex items-center">
                    <i class="fa-solid fa-feather-pointed mr-2 text-stone-700 text-base"></i> Creative Portfolio
                </h2>
                <div id="print-creative-works" class="space-y-4"></div>
            </div>
        </div>

    </div>

    <!-- Script to load data and populate print template -->
    <script>
        async function loadPrintData() {
            try {
                const res = await fetch('portfolio-data.json?t=' + Date.now());
                if (!res.ok) throw new Error('Failed to load portfolio data');
                const data = await res.json();
                
                populateSection('print-background', data.filter(i => i.listType === 'background'));
                populateSection('print-skills', data.filter(i => i.listType === 'skills'));
                populateSection('print-references', data.filter(i => i.listType === 'references'));
                populateStackingSection('print-publications', data.filter(i => i.listType === 'publications'));
                populateStackingSection('print-presentations', data.filter(i => i.listType === 'presentations'));
                populateStackingSection('print-seminars', data.filter(i => i.listType === 'seminars'));
                populateStackingSection('print-creative-works', data.filter(i => i.listType === 'creative-works'));
            } catch (err) {
                console.error(err);
            }
        }

        function populateSection(containerId, items) {
            const container = document.getElementById(containerId);
            items.sort((a, b) => (a.order || 0) - (b.order || 0));
            container.innerHTML = items.map(item => `
                <div class="space-y-1">
                    <div class="flex justify-between font-bold text-stone-900">
                        <span>${escapeHtml(item.title)}</span>
                        <span class="text-stone-500 font-normal">${escapeHtml(item.year || '')}</span>
                    </div>
                    ${item.authors ? `<div class="text-stone-600 font-medium">${escapeHtml(item.authors)}</div>` : ''}
                    ${item.description ? `<div class="text-stone-500">${escapeHtml(item.description)}</div>` : ''}
                </div>
            `).join('');
        }

        function populateStackingSection(containerId, items) {
            const container = document.getElementById(containerId);
            items.sort((a, b) => (a.order || 0) - (b.order || 0));
            container.innerHTML = items.map(item => `
                <div class="border-l-2 border-stone-300 pl-4 space-y-1 text-xs">
                    <div class="flex justify-between items-center">
                        <h4 class="font-serif font-bold text-sm text-stone-900">${escapeHtml(item.title)}</h4>
                        <span class="px-2 py-0.5 rounded bg-stone-100 text-stone-600 font-semibold">${escapeHtml(item.year || '')}</span>
                    </div>
                    ${item.authors ? `<p class="text-stone-600 font-medium">${escapeHtml(item.authors)}</p>` : ''}
                    ${item.description ? `<p class="text-stone-500">${escapeHtml(item.description)}</p>` : ''}
                    ${item.customFields && item.customFields.length > 0 ? `
                        <div class="flex flex-wrap gap-1 mt-1">
                            ${item.customFields.map(cf => `<span class="bg-stone-100 px-1.5 py-0.5 rounded text-[10px] text-stone-700"><strong>${escapeHtml(cf.key)}:</strong> ${escapeHtml(cf.value)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function parseMarkdown(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        window.onload = loadPrintData;
    </script>
</body>
</html>
